services:
  app:
    volumes:
      - ${FLEXDOCS_DATA_ROOT:?Set FLEXDOCS_DATA_ROOT}/uploads:/app/uploads
      - ${FLEXDOCS_DATA_ROOT:?Set FLEXDOCS_DATA_ROOT}/backups:/backups

  db:
    ports: !reset []
    volumes:
      - ${FLEXDOCS_DATA_ROOT:?Set FLEXDOCS_DATA_ROOT}/postgres:/var/lib/postgresql/data

  redis:
    ports: !reset []
    volumes:
      - ${FLEXDOCS_DATA_ROOT:?Set FLEXDOCS_DATA_ROOT}/redis:/data
